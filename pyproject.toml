[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-turno-decoder"
version = "0.1.0"
description = "Standalone inspection of railway roster PDFs; SGI decoding is planned."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<1",
  "starlette>=1.8,<2",
  "uvicorn>=0.41,<1",
  "PyMuPDF>=1.27,<2",
  "Jinja2>=3.1.6,<4",
  "python-multipart>=0.0.22,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx2>=2.13,<3", "ruff>=0.15,<1", "packaging>=22,<27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
railway_turno_decoder = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
